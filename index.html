<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaTech | Professional WHIP Broadcast Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --studio-bg: #09090b;
            --studio-panel: #0c0c0e;
            --studio-card: #121214;
            --studio-border: #27272a;
            --studio-text: #fafafa;
            --studio-text-muted: #71717a;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
        }

        [data-theme='light'] {
            --studio-bg: #f4f4f5;
            --studio-panel: #ffffff;
            --studio-card: #ffffff;
            --studio-border: #e4e4e7;
            --studio-text: #09090b;
            --studio-text-muted: #52525b;
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.2);
        }

        [data-theme='midnight'] {
            --studio-bg: #020617;
            --studio-panel: #0f172a;
            --studio-card: #1e293b;
            --studio-border: #334155;
            --studio-text: #f8fafc;
            --studio-text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
        }

        body {
            background-color: var(--studio-bg);
            color: var(--studio-text);
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.01em;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .studio-glass {
            background: rgba(var(--studio-card-rgb), 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--studio-border);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--studio-border);
            border-radius: 10px;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.5; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        .status-pulse {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
<script type="importmap">

</head>

</html>
